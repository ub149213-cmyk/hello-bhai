<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <h1 id="time"></h1>
  <script>
    var time = document.getElementById("time")
    setInterval(function(){
    var clock = new Date()
    time.innerHTML = clock.toLocaleTimeString()
    



    },1000)
  </script>

  
</body>
</html>
